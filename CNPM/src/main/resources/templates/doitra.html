<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đổi Trả</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/main.js"></script>
</head>
<body>
	<div id="navbar"></div>
	<div class="container-fluid">
		<div class="row">
			<div id="sidebar"></div>
			<main class="col-md-10 ms-sm-auto px-4">
				<div class="d-flex justify-content-between mt-3 mb-3">
					<h2>Đổi Trả Hàng</h2>
					<button class="btn btn-primary" data-bs-toggle="modal"
						data-bs-target="#formModal">Thêm Đổi Trả</button>
				</div>

				<ul class="nav nav-tabs mt-3">
					<li class="nav-item"><a class="nav-link active"
						data-status="all" href="#">Tất cả</a></li>
					<li class="nav-item"><a class="nav-link"
						data-status="ChuaXuLy" href="#">Chưa Xử Lý</a></li>
					<li class="nav-item"><a class="nav-link" data-status="DaXuLy"
						href="#">Đã Xử Lý</a></li>
				</ul>

				<table class="table table-striped mt-3" id="table">
					<thead>
						<tr>
							<th>Mã</th>
							<th>Mã HĐ</th>
							<th>Sản Phẩm</th>
							<th>Số Lượng</th>
							<th>Lý Do</th>
							<th>Ngày</th>
							<th>Trạng Thái</th>
							<th>Thao Tác</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</main>
		</div>
	</div>
	<div class="modal fade" id="formModal" tabindex="-1">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Đổi Trả Hàng</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="form">
						<input type="hidden" id="maDoiTra">
						<div class="mb-3">
							<label class="form-label">Mã Hóa Đơn *</label> <input type="text"
								class="form-control" id="maHD" required>
						</div>
						<div class="mb-3">
							<label class="form-label">Sản Phẩm *</label> <select
								class="form-select" id="maSP" required></select>
						</div>
						<div class="mb-3">
							<label class="form-label">Số Lượng *</label> <input type="number"
								class="form-control" id="soLuong" min="1" required>
						</div>
						<div class="mb-3">
							<label class="form-label">Lý Do *</label>
							<textarea class="form-control" id="lyDo" rows="3" required></textarea>
						</div>
						<div class="mb-3">
							<label class="form-label">Ngày Đổi Trả</label> <input type="date"
								class="form-control" id="ngayDoiTra">
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Đóng</button>
					<button type="button" class="btn btn-primary" id="saveBtn">Lưu</button>
				</div>
			</div>
		</div>
	</div>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
	let allData = [];
	let modal;

	$(document).ready(async function() {
	    modal = new bootstrap.Modal($('#formModal')[0]);
	    $('#ngayDoiTra').val(new Date().toISOString().split('T')[0]);

	    await loadSanPham();
	    await loadData('all');

	    $('.nav-link').on('click', async function(e) {
	        e.preventDefault();
	        $('.nav-link').removeClass('active');
	        $(this).addClass('active');
	        await loadData($(this).data('status'));
	    });

	    $('#saveBtn').on('click', save);

	    $('#formModal').on('show.bs.modal', function() {
	        if (!$('#maDoiTra').val()) {
	            $('#form')[0].reset();
	            $('#ngayDoiTra').val(new Date().toISOString().split('T')[0]);
	        }
	    });
	});

	async function loadSanPham() {
	    const res = await API.get('/sanpham');
	    const sp = res.data || [];
	    $('#maSP').html('<option value="">Chọn sản phẩm</option>' + 
	        sp.map(s => `<option value="${s.maSP}">${s.tenSP}</option>`).join(''));
	}

	async function loadData(status) {
	    const res = await API.get('/doitra');
	    allData = res.data || [];

	    let data = allData;
	    if (status !== 'all') {
	        data = data.filter(d => (d.trangThai || 'ChuaXuLy') === status);
	    }

	    Table.render('table', data, [
	        {field: 'maDoiTra'},
	        {render: r => r.maHD || '-'},
	        {field: 'tenSP'},
	        {field: 'soLuong'},
	        {field: 'lyDo'},
	        {render: r => Format.date(r.ngayDoiTra)},
	        {render: r => Format.status(r.trangThai || 'ChuaXuLy')},
	        {render: r => {
	            const tt = r.trangThai || 'ChuaXuLy';
	            let btns = `<button class="btn btn-sm btn-info" onclick="edit('${r.maDoiTra}')">Sửa</button> `;
	            btns += `<button class="btn btn-sm btn-danger" onclick="del('${r.maDoiTra}')">Xóa</button> `;
	            if (tt === 'ChuaXuLy') {
	                btns += `<button class="btn btn-sm btn-success" onclick="xuLy('${r.maDoiTra}')">Xử lý</button>`;
	            }
	            return btns;
	        }}
	    ]);
	}
	function edit(id) {
	    const item = allData.find(d => d.maDoiTra === id);
	    if (!item) return;
	    
	    $('#maDoiTra').val(item.maDoiTra);
	    $('#maHD').val(item.maHD || '');
	    $('#maSP').val(item.maSP);
	    $('#soLuong').val(item.soLuong);
	    $('#lyDo').val(item.lyDo);
	    if (item.ngayDoiTra) {
	        const date = new Date(item.ngayDoiTra);
	        $('#ngayDoiTra').val(date.toISOString().split('T')[0]);
	    }
	    
	    modal.show();
	}

	function del(id) {
	    Modal.confirm('Xác nhận', 'Xóa phiếu đổi trả?', async () => {
	        const res = await API.delete(`/doitra/${id}`);
	        Toast.success(res.message);
	        await loadData($('.nav-link.active').data('status'));
	    });
	}

	async function save() {
	    if (!$('#form')[0].checkValidity()) {
	        $('#form')[0].reportValidity();
	        return;
	    }

	    const maDoiTra = $('#maDoiTra').val();

	    const data = {
	        maHD: $('#maHD').val(),
	        maSP: $('#maSP').val(),
	        soLuong: parseInt($('#soLuong').val()),
	        lyDo: $('#lyDo').val(),
	        ngayDoiTra: $('#ngayDoiTra').val()
	    };

	    try {
	        const res = maDoiTra
	            ? await API.put(`/doitra/${maDoiTra}`, data)
	            : await API.post('/doitra', data);
	        
	        Toast.success(res.message);
	        modal.hide();
	        $('#form')[0].reset();
	        $('#maDoiTra').val('');
	        $('#ngayDoiTra').val(new Date().toISOString().split('T')[0]);
	        
	        await loadData($('.nav-link.active').data('status'));
	    } catch (error) {
	        Toast.error('Có lỗi xảy ra');
	    }
	}

	async function xuLy(id) {
	    Modal.confirm('Xác nhận', 'Xử lý phiếu đổi trả?', async () => {
	        const res = await API.put(`/doitra/${id}/xuly`);
	        Toast.success(res.message);
	        await loadData($('.nav-link.active').data('status'));
	    });
	}
    </script>
</body>
</html>

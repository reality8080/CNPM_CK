<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập Kho</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/main.js"></script>
</head>
<body>
	<div id="navbar"></div>
	<div class="container-fluid">
		<div class="row">
			<div id="sidebar"></div>
			<main class="col-md-10 ms-sm-auto px-4">
				<ul class="nav nav-tabs mt-3">
					<li class="nav-item"><a class="nav-link active"
						data-tab="list" href="#">Danh Sách</a></li>
					<li class="nav-item"><a class="nav-link" data-tab="create"
						href="#">Tạo Phiếu</a></li>
				</ul>

				<div id="listTab" class="mt-3">
					<div class="row mb-3">
						<div class="col-md-3">
							<input type="date" class="form-control" id="tuNgay">
						</div>
						<div class="col-md-3">
							<input type="date" class="form-control" id="denNgay">
						</div>
						<div class="col-md-3">
							<select class="form-select" id="trangThai">
								<option value="">Tất cả</option>
								<option value="DangXuLy">Đang Xử Lý</option>
								<option value="DaNhap">Đã Nhập</option>
							</select>
						</div>
						<div class="col-md-3">
							<button class="btn btn-primary" id="filterBtn">Lọc</button>
						</div>
					</div>

					<table class="table table-striped" id="table">
						<thead>
							<tr>
								<th>Mã Phiếu</th>
								<th>Ngày Nhập</th>
								<th>Nhân Viên</th>
								<th>Tổng Tiền</th>
								<th>Trạng Thái</th>
								<th>Thao Tác</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>

				<div id="createTab" class="mt-3" style="display: none">
					<form id="form">
						<div class="card mb-3">
							<div class="card-body">
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Ngày Nhập</label> <input type="date"
											class="form-control" id="ngayNhap" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">Ghi Chú</label> <input type="text"
											class="form-control" id="ghiChu">
									</div>
								</div>
							</div>
						</div>

						<div class="card mb-3">
							<div class="card-header d-flex justify-content-between">
								<h5 class="mb-0">Chi Tiết</h5>
								<button type="button" class="btn btn-sm btn-primary" id="addRow">Thêm</button>
							</div>
							<div class="card-body">
								<table class="table" id="detailTable">
									<thead>
										<tr>
											<th>Sản Phẩm</th>
											<th>Số Lượng</th>
											<th>Đơn Giá</th>
											<th>Thành Tiền</th>
											<th></th>
										</tr>
									</thead>
									<tbody></tbody>
									<tfoot>
										<tr>
											<td colspan="3" class="text-end"><strong>Tổng:</strong></td>
											<td colspan="2"><strong id="tongTien">0 ₫</strong></td>
										</tr>
									</tfoot>
								</table>
							</div>
						</div>

						<button type="submit" class="btn btn-primary">Lưu Phiếu</button>
					</form>
				</div>
			</main>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        let sanPhamList = [];
        let chiTietList = [];

        $(document).ready(async function() {
            $('#ngayNhap').val(new Date().toISOString().split('T')[0]);
            loadData();
            loadSanPham();

            $('.nav-link').on('click', function(e) {
                e.preventDefault();
                $('.nav-link').removeClass('active');
                $(this).addClass('active');
                
                const tab = $(this).data('tab');
                if (tab === 'list') {
                    $('#listTab').show();
                    $('#createTab').hide();
                } else {
                    $('#listTab').hide();
                    $('#createTab').show();
                }
            });

            $('#filterBtn').on('click', loadData);
            $('#addRow').on('click', addRow);
            $('#form').on('submit', save);
        });

        async function loadData() {
        	const tu = $('#tuNgay').val();
            const den = $('#denNgay').val();
            const tt = $('#trangThai').val();

            let endpoint = '/nhapkho';
            if (tu && den) endpoint = `/nhapkho/date-range?start=${tu}&end=${den}`;
            else if (tt) endpoint = `/nhapkho/trangthai/${tt}`;

            const res = await API.get(endpoint);
            const data = res.data || [];  // Thêm dòng này

            Table.render('table', data, [
                {field: 'maPNK'},
                {render: r => Format.date(r.ngayNhap)},
                {field: 'maNV'},
                {render: r => Format.currency(r.tongTien)},
                {render: r => Format.status(r.trangThai)},
                {render: r => `
                    <button class="btn btn-sm btn-info" onclick="viewDetail('${r.maPNK}')">Chi tiết</button>
                    ${r.trangThai === 'DangXuLy' ? `<button class="btn btn-sm btn-success" onclick="confirm('${r.maPNK}')">Xác nhận</button>` : ''}
                `}
            ]);
        }

        async function loadSanPham() {
        	const res = await API.get('/sanpham');
            sanPhamList = res.data || [];
        }

        function addRow() {
            const row = $(`
                <tr>
                    <td>
                        <select class="form-select sp-select" required>
                            <option value="">Chọn sản phẩm</option>
                            ${sanPhamList.map(s => `<option value="${s.maSP}">${s.tenSP}</option>`).join('')}
                        </select>
                    </td>
                    <td><input type="number" class="form-control sl-input" min="1" value="1" required></td>
                    <td><input type="number" class="form-control dg-input" min="0" value="0" required></td>
                    <td class="tt-cell">0 ₫</td>
                    <td><button type="button" class="btn btn-sm btn-danger" onclick="$(this).closest('tr').remove();updateTotal()">Xóa</button></td>
                </tr>
            `);

            row.find('.sp-select, .sl-input, .dg-input').on('change', function() {
                const tr = $(this).closest('tr');
                const sl = parseInt(tr.find('.sl-input').val()) || 0;
                const dg = parseFloat(tr.find('.dg-input').val()) || 0;
                tr.find('.tt-cell').text(Format.currency(sl * dg));
                updateTotal();
            });

            $('#detailTable tbody').append(row);
        }

        function updateTotal() {
            chiTietList = [];
            let total = 0;

            $('#detailTable tbody tr').each(function() {
                const maSP = $(this).find('.sp-select').val();
                const sl = parseInt($(this).find('.sl-input').val()) || 0;
                const dg = parseFloat($(this).find('.dg-input').val()) || 0;
                const tt = sl * dg;

                if (maSP && sl > 0) {
                    chiTietList.push({
                        sanPham: {maSP},
                        soLuong: sl,
                        donGiaNhap: dg,
                        thanhTien: tt
                    });
                    total += tt;
                }
            });

            $('#tongTien').text(Format.currency(total));
        }

        async function save(e) {
        	e.preventDefault();
            
            updateTotal();  // Đảm bảo cập nhật chiTietList
            
            if (chiTietList.length === 0) {
                Toast.error('Vui lòng thêm chi tiết nhập kho');
                return;
            }

            const data = {
                ngayNhap: $('#ngayNhap').val(),
                maNV: 'NV001',
                trangThai: 'DangXuLy',
                chiTiet: chiTietList.map(ct => ({
                    maSP: ct.sanPham.maSP,
                    soLuong: ct.soLuong,
                    donGiaNhap: ct.donGiaNhap
                }))
            };

            const res = await API.post('/nhapkho', data);
            Toast.success(res.message);
            
            // Reset form và chuyển tab
            $('#form')[0].reset();
            $('#detailTable tbody').empty();
            chiTietList = [];
            $('#tongTien').text('0 ₫');
            
            $('.nav-link').removeClass('active');
            $('.nav-link[data-tab="list"]').addClass('active');
            $('#createTab').hide();
            $('#listTab').show();
            
            await loadData();
        }

        async function confirm(id) {
        	Modal.confirm('Xác nhận', 'Xác nhận nhập kho?', async () => {
                const res = await API.put(`/nhapkho/${id}/trangthai?trangThai=DaNhap`);
                Toast.success(res.message);
                await loadData();
            });
        }

        async function viewDetail(id) {
        	const res = await API.get(`/nhapkho/${id}`);
            const detail = res.data;
            
            let html = `
                <div class="modal fade" id="detailModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5>Chi tiết phiếu ${detail.maPNK}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p><strong>Ngày nhập:</strong> ${Format.date(detail.ngayNhap)}</p>
                                <p><strong>Nhân viên:</strong> ${detail.maNV}</p>
                                <p><strong>Trạng thái:</strong> ${Format.status(detail.trangThai)}</p>
                                <table class="table">
                                    <thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
                                    <tbody>
                                        ${detail.chiTiet.map(ct => `
                                            <tr>
                                                <td>${ct.tenSP}</td>
                                                <td>${ct.soLuong}</td>
                                                <td>${Format.currency(ct.donGiaNhap)}</td>
                                                <td>${Format.currency(ct.thanhTien)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                                <p class="text-end"><strong>Tổng: ${Format.currency(detail.tongTien)}</strong></p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            $('#detailModal').remove();
            $('body').append(html);
            const modal = new bootstrap.Modal($('#detailModal')[0]);
            modal.show();
        }
        
    </script>
</body>
</html>

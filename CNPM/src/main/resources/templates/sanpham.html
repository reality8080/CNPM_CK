<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Sản Phẩm</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link href="/assets/css/style.css" rel="stylesheet">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/main.js"></script>
<style>
:root {
	--primary: #4f46e5;
	--primary-dark: #4338ca;
	--secondary: #64748b;
	--success: #10b981;
	--danger: #ef4444;
	--warning: #f59e0b;
	--light-bg: #f8fafc;
	--border: #e2e8f0;
	--shadow: 0 1px 3px 0 rgb(0 0 0/ 0.1);
	--shadow-lg: 0 10px 15px -3px rgb(0 0 0/ 0.1);
}

body {
	background: var(--light-bg);
	font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
	color: #1e293b;
}

.page-header {
	background: white;
	border-bottom: 1px solid var(--border);
	padding: 1.5rem 0;
	margin-bottom: 2rem;
	box-shadow: var(--shadow);
}

.page-title {
	font-size: 1.75rem;
	font-weight: 700;
	color: #0f172a;
	margin: 0;
}

.btn-primary {
	background: var(--primary);
	border: none;
	padding: 0.625rem 1.5rem;
	font-weight: 600;
	border-radius: 0.5rem;
	transition: all 0.2s;
}

.btn-primary:hover {
	background: var(--primary-dark);
	transform: translateY(-1px);
	box-shadow: var(--shadow-lg);
}

.filter-card {
	background: white;
	border-radius: 0.75rem;
	padding: 1.5rem;
	margin-bottom: 1.5rem;
	box-shadow: var(--shadow);
	border: 1px solid var(--border);
}

.form-control, .form-select {
	border: 1px solid var(--border);
	border-radius: 0.5rem;
	padding: 0.625rem 1rem;
	transition: all 0.2s;
}

.form-control:focus, .form-select:focus {
	border-color: var(--primary);
	box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.table-card {
	background: white;
	border-radius: 0.75rem;
	overflow: hidden;
	box-shadow: var(--shadow);
	border: 1px solid var(--border);
}

.table {
	margin: 0;
}

.table thead {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

.table thead th {
	color: #1e293b;
	background: #f1f5f9;
	font-weight: 600;
	text-transform: none;
	font-size: 0.875rem;
	letter-spacing: 0;
	padding: 1rem;
	border: none;
	border-bottom: 2px solid #e2e8f0;
}

.table tbody tr {
	border-bottom: 1px solid var(--border);
	transition: all 0.2s;
}

.table tbody tr:hover {
	background: #f1f5f9;
}

.table tbody td {
	padding: 1rem;
	vertical-align: middle;
}

.product-img {
	width: 60px;
	height: 60px;
	object-fit: cover;
	border-radius: 0.5rem;
	cursor: pointer;
	transition: transform 0.2s;
	border: 2px solid var(--border);
}

.product-img:hover {
	transform: scale(1.1);
}

.badge-stock {
	padding: 0.375rem 0.75rem;
	border-radius: 0.375rem;
	font-weight: 600;
	font-size: 0.875rem;
}

.badge-low {
	background: #fee2e2;
	color: #991b1b;
}

.badge-normal {
	background: #d1fae5;
	color: #065f46;
}

.btn-action {
	padding: 0.375rem 0.875rem;
	border-radius: 0.375rem;
	font-size: 0.875rem;
	font-weight: 500;
	border: none;
	transition: all 0.2s;
	margin: 0 0.25rem;
}

.btn-edit {
	background: #dbeafe;
	color: #1e40af;
}

.btn-edit:hover {
	background: #3b82f6;
	color: white;
}

.btn-delete {
	background: #fee2e2;
	color: #991b1b;
}

.btn-delete:hover {
	background: #ef4444;
	color: white;
}

.modal-content {
	border: none;
	border-radius: 1rem;
	box-shadow: 0 20px 25px -5px rgb(0 0 0/ 0.1);
}

.modal-header {
	background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
	color: white;
	border-radius: 1rem 1rem 0 0;
	padding: 1.5rem;
	border: none;
}

.modal-title {
	font-weight: 700;
	font-size: 1.25rem;
}

.modal-body {
	padding: 2rem;
}

.modal-footer {
	border-top: 1px solid var(--border);
	padding: 1.25rem 2rem;
}

.form-label {
	font-weight: 600;
	color: #334155;
	margin-bottom: 0.5rem;
	font-size: 0.875rem;
}

.image-upload-area {
	border: 2px dashed var(--border);
	border-radius: 0.75rem;
	padding: 1rem;
	text-align: center;
	transition: all 0.2s;
}

.image-upload-area:hover {
	border-color: var(--primary);
	background: #f8fafc;
}

#preview {
	border-radius: 0.75rem;
	max-height: 250px;
	object-fit: cover;
	margin-bottom: 1rem;
	border: 2px solid var(--border);
}

.input-icon {
	position: relative;
}

.input-icon i {
	position: absolute;
	left: 1rem;
	top: 50%;
	transform: translateY(-50%);
	color: var(--secondary);
}

.input-icon .form-control {
	padding-left: 2.75rem;
}

.empty-state {
	text-align: center;
	padding: 3rem;
	color: var(--secondary);
}

.empty-state i {
	font-size: 4rem;
	margin-bottom: 1rem;
	opacity: 0.3;
}

.price-tag {
	font-weight: 700;
	color: var(--primary);
	font-size: 1rem;
}

.category-badge {
	background: #f1f5f9;
	color: #475569;
	padding: 0.25rem 0.75rem;
	border-radius: 0.375rem;
	font-size: 0.875rem;
	font-weight: 500;
}
</style>
</head>
<body>
	<div id="navbar"></div>
	<div class="container-fluid">
		<div class="row">
			<div id="sidebar"></div>
			<main class="col-md-10 ms-sm-auto px-4">
				<div class="page-header">
					<div class="d-flex justify-content-between align-items-center">
						<h1 class="page-title">
							<i class="bi bi-box-seam me-2"></i>Quản Lý Sản Phẩm
						</h1>
						<button class="btn btn-primary" data-bs-toggle="modal"
							data-bs-target="#formModal">
							<i class="bi bi-plus-circle me-2"></i>Thêm Sản Phẩm
						</button>
					</div>
				</div>

				<div class="filter-card">
					<div class="row g-3">
						<div class="col-md-6">
							<div class="input-icon">
								<i class="bi bi-search"></i> <input type="text"
									class="form-control" id="search"
									placeholder="Tìm kiếm theo tên hoặc mã sản phẩm...">
							</div>
						</div>
						<div class="col-md-4">
							<select class="form-select" id="dmFilter">
								<option value="">Tất cả danh mục</option>
							</select>
						</div>
						<div class="col-md-2">
							<button class="btn btn-outline-secondary w-100"
								onclick="resetFilters()">
								<i class="bi bi-arrow-clockwise me-2"></i>Đặt lại
							</button>
						</div>
					</div>
				</div>

				<div class="table-card">
					<div class="table-responsive">
						<table class="table" id="table">
							<thead>
								<tr>
									<th style="width: 100px;">Mã SP</th>
									<th style="width: 80px;">Hình ảnh</th>
									<th style="width: 150px;">Tên sản phẩm</th>
									<th style="width: 120px;">Danh mục</th>
									<th style="width: 120px;">Giá bán</th>
									<th style="width: 100px;">Tồn kho</th>
									<th style="width: 100px;">Kích thước</th>
									<th style="width: 100px;">Màu sắc</th>
									<th style="width: 120px;">Chất liệu</th>
									<th style="width: 200px;">Mô tả</th>
									<th style="width: 180px;">Thao tác</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
			</main>
		</div>
	</div>

	<div class="modal fade" id="formModal" tabindex="-1">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">
						<i class="bi bi-box me-2"></i>Thông Tin Sản Phẩm
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="form">
						<input type="hidden" id="maSP">
						<div class="row">
							<div class="col-md-8">
								<div class="mb-3">
									<label class="form-label"> <i class="bi bi-tag me-1"></i>Tên
										Sản Phẩm <span class="text-danger">*</span>
									</label> <input type="text" class="form-control" id="tenSP"
										placeholder="Nhập tên sản phẩm" required>
								</div>
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label"> <i
											class="bi bi-currency-dollar me-1"></i>Giá Bán <span
											class="text-danger">*</span>
										</label> <input type="number" class="form-control" id="giaBan"
											placeholder="0" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label"> <i
											class="bi bi-folder me-1"></i>Danh Mục <span
											class="text-danger">*</span>
										</label> <select class="form-select" id="danhMuc" required>
											<option value="">Chọn danh mục</option>
										</select>
									</div>
								</div>
								<div class="row">
									<div class="col-md-4 mb-3">
										<label class="form-label"> <i
											class="bi bi-rulers me-1"></i>Kích Thước
										</label> <input type="text" class="form-control" id="kichThuoc"
											placeholder="S, M, L...">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label"> <i
											class="bi bi-palette me-1"></i>Màu Sắc
										</label> <input type="text" class="form-control" id="mauSac"
											placeholder="Đỏ, Xanh...">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label"> <i
											class="bi bi-layers me-1"></i>Chất Liệu
										</label> <input type="text" class="form-control" id="chatLieu"
											placeholder="Cotton, Vải...">
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label"> <i
										class="bi bi-text-paragraph me-1"></i>Mô Tả
									</label>
									<textarea class="form-control" id="moTa" rows="4"
										placeholder="Nhập mô tả chi tiết sản phẩm..."></textarea>
								</div>
							</div>
							<div class="col-md-4">
								<label class="form-label"> <i class="bi bi-image me-1"></i>Hình
									Ảnh
								</label>
								<div class="image-upload-area">
									<img id="preview" src="/assets/img/no-image.png"
										class="img-fluid"> <input type="file"
										class="form-control" id="hinhAnh" accept="image/*"> <input
										type="hidden" id="hinhAnhUrl"> <small
										class="text-muted d-block mt-2"> <i
										class="bi bi-info-circle me-1"></i>JPG, PNG (Max 5MB)
									</small>
								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">
						<i class="bi bi-x-circle me-2"></i>Đóng
					</button>
					<button type="button" class="btn btn-primary" id="saveBtn">
						<i class="bi bi-check-circle me-2"></i>Lưu Sản Phẩm
					</button>
				</div>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        let allData = [];
        let modal;

        $(document).ready(async function() {
            modal = new bootstrap.Modal($('#formModal')[0]);
            loadData();
            loadDanhMuc();
            
            $('#search, #dmFilter').on('input change', filterData);
            $('#saveBtn').on('click', save);
            
            $('#hinhAnh').on('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        $('#preview').attr('src', e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            $('#formModal').on('hidden.bs.modal', function() {
                $('#form')[0].reset();
                $('#maSP').val('');
                $('#preview').attr('src', '/assets/img/no-image.png');
            });
        });

        async function loadData() {
            const res = await API.get('/sanpham');
            allData = res.data || [];
            renderTable(allData);
        }

        async function loadDanhMuc() {
            const res = await API.get('/danhmuc');
            const dm = res.data || [];
            $('#danhMuc, #dmFilter').append(dm.map(d =>
                `<option value="${d.maDM}">${d.tenDM}</option>`
            ).join(''));
        }

        function filterData() {
            const search = $('#search').val().toLowerCase();
            const dm = $('#dmFilter').val();

            let filtered = allData;
            if (search) {
                filtered = filtered.filter(s => 
                    s.tenSP.toLowerCase().includes(search) || 
                    s.maSP.toLowerCase().includes(search)
                );
            }
            if (dm) {
                filtered = filtered.filter(s => s.maDM === dm);
            }

            renderTable(filtered);
        }

        function resetFilters() {
            $('#search').val('');
            $('#dmFilter').val('');
            renderTable(allData);
        }

        function renderTable(data) {
            if (data.length === 0) {
                $('#table tbody').html(`
                    <tr>
                        <td colspan="11" class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p class="mb-0">Không có sản phẩm nào</p>
                        </td>
                    </tr>
                `);
                return;
            }

            const tbody = data.map(r => {
                const imgSrc = r.hinhAnh ? r.hinhAnh : '/assets/img/no-image.png';
                const isLow = r.soLuongTon < 10;
                const moTa = r.moTa || '-';
                const moTaDisplay = moTa.length > 50 ? `<span title="${moTa}">${moTa.substring(0, 50)}...</span>` : moTa;
                
                return `
                    <tr>
                        <td>${r.maSP}</td>
                        <td><img src="${imgSrc}" class="product-img" onclick="Modal.showImage('${imgSrc}','${r.tenSP}')"></td>
                        <td><div class="fw-semibold">${r.tenSP}</div></td>
                        <td>${r.tenDanhMuc ? `<span class="category-badge">${r.tenDanhMuc}</span>` : '-'}</td>
                        <td><span class="price-tag">${Format.currency(r.giaBan)}</span></td>
                        <td><span class="badge-stock ${isLow ? 'badge-low' : 'badge-normal'}">${r.soLuongTon}</span></td>
                        <td>${r.kichThuoc || '-'}</td>
                        <td>${r.mauSac || '-'}</td>
                        <td>${r.chatLieu || '-'}</td>
                        <td>${moTaDisplay}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="edit('${r.maSP}')">
                                <i class="bi bi-pencil me-1"></i>Sửa
                            </button>
                            <button class="btn-action btn-delete" onclick="del('${r.maSP}')">
                                <i class="bi bi-trash me-1"></i>Xóa
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
            
            $('#table tbody').html(tbody);
        }
        
        function edit(id) {
            const item = allData.find(s => s.maSP === id);
            if (!item) return;
            
            $('#maSP').val(item.maSP);
            $('#tenSP').val(item.tenSP);
            $('#giaBan').val(item.giaBan);
            $('#danhMuc').val(item.maDM);
            $('#kichThuoc').val(item.kichThuoc);
            $('#mauSac').val(item.mauSac);
            $('#chatLieu').val(item.chatLieu);
            $('#moTa').val(item.moTa);
            $('#hinhAnhUrl').val(item.hinhAnh || '');
            
            const imgSrc = item.hinhAnh ? item.hinhAnh : '/assets/img/no-image.png';
            $('#preview').attr('src', imgSrc);
            
            modal.show();
        }

        function del(id) {
            Modal.confirm('Xác nhận', 'Bạn có chắc chắn muốn xóa sản phẩm này?', async () => {
                const res = await API.delete(`/sanpham/${id}`);
                Toast.success(res.message);
                loadData();
            });
        }
        
        async function save() {
            if (!$('#form')[0].checkValidity()) {
                $('#form')[0].reportValidity();
                return;
            }
            const formData = new FormData();
            const data = {
                tenSP: $('#tenSP').val(),
                giaBan: parseFloat($('#giaBan').val()),
                maDM: $('#danhMuc').val(),
                kichThuoc: $('#kichThuoc').val(),
                mauSac: $('#mauSac').val(),
                chatLieu: $('#chatLieu').val(),
                moTa: $('#moTa').val()
            };
            formData.append('data', new Blob([JSON.stringify(data)], {type: 'application/json'}));
            
            const file = $('#hinhAnh')[0].files[0];
            if (file) {
                formData.append('file', file);
            }

            const maSP = $('#maSP').val();
            
            try {
                const res = maSP
                    ? await API.putFormData(`/sanpham/${maSP}`, formData)
                    : await API.postFormData('/sanpham', formData);
                
                Toast.success(res.message);
                modal.hide();
                $('#form')[0].reset();
                $('#maSP').val('');
                $('#preview').attr('src', '/assets/img/no-image.png');
                await loadData();
            } catch (error) {
                Toast.error('Có lỗi xảy ra');
            }
        }
    </script>
</body>
</html>

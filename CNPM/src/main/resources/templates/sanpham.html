<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Sản Phẩm</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/main.js"></script>
</head>
<body>
	<div id="navbar"></div>
	<div class="container-fluid">
		<div class="row">
			<div id="sidebar"></div>
			<main class="col-md-10 ms-sm-auto px-4">
				<div class="d-flex justify-content-between mt-3 mb-3">
					<h2>Quản Lý Sản Phẩm</h2>
					<button class="btn btn-primary" data-bs-toggle="modal"
						data-bs-target="#formModal">Thêm Sản Phẩm</button>
				</div>

				<div class="row mb-3">
					<div class="col-md-4">
						<input type="text" class="form-control" id="search"
							placeholder="Tìm kiếm...">
					</div>
					<div class="col-md-3">
						<select class="form-select" id="dmFilter">
							<option value="">Tất cả danh mục</option>
						</select>
					</div>
				</div>

				<table class="table table-striped" id="table">
					<thead>
						<tr>
							<th>Mã</th>
							<th>Hình</th>
							<th>Tên</th>
							<th>Danh Mục</th>
							<th>Giá</th>
							<th>Tồn</th>
							<th>Thao Tác</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</main>
		</div>
	</div>

	<div class="modal fade" id="formModal" tabindex="-1">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Sản Phẩm</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<form id="form">
						<input type="hidden" id="maSP">
						<div class="row">
							<div class="col-md-8">
								<div class="mb-3">
									<label class="form-label">Tên Sản Phẩm *</label> <input
										type="text" class="form-control" id="tenSP" required>
								</div>
								<div class="row">
									<div class="col-md-6 mb-3">
										<label class="form-label">Giá Bán *</label> <input
											type="number" class="form-control" id="giaBan" required>
									</div>
									<div class="col-md-6 mb-3">
										<label class="form-label">Danh Mục *</label> <select
											class="form-select" id="danhMuc" required></select>
									</div>
								</div>
								<div class="row">
									<div class="col-md-4 mb-3">
										<label class="form-label">Kích Thước</label> <input
											type="text" class="form-control" id="kichThuoc">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Màu Sắc</label> <input type="text"
											class="form-control" id="mauSac">
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Chất Liệu</label> <input type="text"
											class="form-control" id="chatLieu">
									</div>
								</div>
								<div class="mb-3">
									<label class="form-label">Mô Tả</label>
									<textarea class="form-control" id="moTa" rows="3"></textarea>
								</div>
							</div>
							<div class="col-md-4">
								<label class="form-label">Hình Ảnh</label> <img id="preview"
									src="../assets/img/no-image.png" class="img-fluid mb-2">
								<input type="file" class="form-control" id="hinhAnh"
									accept="image/*"> <input type="hidden" id="hinhAnhUrl">
							</div>
						</div>
					</form>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						data-bs-dismiss="modal">Đóng</button>
					<button type="button" class="btn btn-primary" id="saveBtn">Lưu</button>
				</div>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        let allData = [];
        let modal;

        $(document).ready(async function() {
            modal = new bootstrap.Modal($('#formModal')[0]);
            loadData();
            loadDanhMuc();
            
            $('#search, #dmFilter').on('input change', filterData);
            $('#saveBtn').on('click', save);
            
            $('#hinhAnh').on('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        $('#preview').attr('src', e.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
            
            $('#formModal').on('hidden.bs.modal', function() {
                $('#form')[0].reset();
                $('#maSP').val('');
                $('#preview').attr('src', '/assets/img/no-image.png');
            });
        });

        async function loadData() {
        	const res = await API.get('/sanpham');
            allData = res.data || [];
            renderTable(allData);
        }

        async function loadDanhMuc() {
        	const res = await API.get('/danhmuc');
            const dm = res.data || [];
            $('#danhMuc, #dmFilter').append(dm.map(d =>
                `<option value="${d.maDM}">${d.tenDM}</option>`
            ).join(''));
        }

        function filterData() {
        	const search = $('#search').val().toLowerCase();
            const dm = $('#dmFilter').val();

            let filtered = allData;
            if (search) {
                filtered = filtered.filter(s => 
                    s.tenSP.toLowerCase().includes(search) || 
                    s.maSP.toLowerCase().includes(search)
                );
            }
            if (dm) {
                filtered = filtered.filter(s => s.maDM === dm);
            }

            renderTable(filtered);
        }

        function renderTable(data) {
            Table.render('table', data, [
                {field: 'maSP'},
                {render: r => {
                    const imgSrc = r.hinhAnh ? r.hinhAnh : '/assets/img/no-image.png';
                    return `<img src="${imgSrc}" onclick="Modal.showImage('${imgSrc}','${r.tenSP}')">`;
                }},
                {field: 'tenSP'},
                {render: r => r.tenDanhMuc || ''},
                {render: r => Format.currency(r.giaBan)},
                {render: r => `<span class="${r.soLuongTon < 10 ? 'text-danger fw-bold' : ''}">${r.soLuongTon}</span>`},
                {render: r => `
                    <button class="btn btn-sm btn-info" onclick="edit('${r.maSP}')">Sửa</button>
                    <button class="btn btn-sm btn-danger" onclick="del('${r.maSP}')">Xóa</button>
                `}
            ]);
        }

        function edit(id) {
        	const item = allData.find(s => s.maSP === id);
            if (!item) return;
            
            $('#maSP').val(item.maSP);
            $('#tenSP').val(item.tenSP);
            $('#giaBan').val(item.giaBan);
            $('#danhMuc').val(item.maDM);
            $('#kichThuoc').val(item.kichThuoc);
            $('#mauSac').val(item.mauSac);
            $('#chatLieu').val(item.chatLieu);
            $('#moTa').val(item.moTa);
            $('#hinhAnhUrl').val(item.hinhAnh || '');
            
            const imgSrc = item.hinhAnh ? item.hinhAnh : '/assets/img/no-image.png';
            $('#preview').attr('src', imgSrc);
            
            modal.show();
        }

        function del(id) {
        	Modal.confirm('Xác nhận', 'Xóa sản phẩm?', async () => {
                const res = await API.delete(`/sanpham/${id}`);
                Toast.success(res.message);
                loadData();
            });
        }
        
        async function save() {
        	if (!$('#form')[0].checkValidity()) {
                $('#form')[0].reportValidity();
                return;
            }
            const formData = new FormData();
            const data = {
                tenSP: $('#tenSP').val(),
                giaBan: parseFloat($('#giaBan').val()),
                maDM: $('#danhMuc').val(),
                kichThuoc: $('#kichThuoc').val(),
                mauSac: $('#mauSac').val(),
                chatLieu: $('#chatLieu').val(),
                moTa: $('#moTa').val()
            };
            formData.append('data', new Blob([JSON.stringify(data)], {type: 'application/json'}));
            
            const file = $('#hinhAnh')[0].files[0];
            if (file) {
                formData.append('file', file);
            }

            const maSP = $('#maSP').val();
            
            try {
                const res = maSP
                    ? await API.putFormData(`/sanpham/${maSP}`, formData)
                    : await API.postFormData('/sanpham', formData);
                
                Toast.success(res.message);
                modal.hide();
                $('#form')[0].reset();
                $('#maSP').val('');
                $('#preview').attr('src', '/assets/img/no-image.png');
                await loadData();
            } catch (error) {
                Toast.error('Có lỗi xảy ra');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<title>Tồn Kho</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body style="background: #f5f6fa;">
	<div class="container mt-4">
		<h3 class="mb-4 text-center fw-bold text-primary">TỒN KHO SẢN
			PHẨM</h3>

		<!-- Thẻ thống kê -->
		<div class="row text-center mb-4">
			<div class="col-md-3">
				<div class="card bg-primary text-white">
					<div class="card-body">
						<h6>Tổng sản phẩm</h6>
						<h3 id="tongSP">0</h3>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="card bg-success text-white">
					<div class="card-body">
						<h6>Tổng số lượng tồn</h6>
						<h3 id="tongSL">0</h3>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="card bg-info text-white">
					<div class="card-body">
						<h6>Giá trị tồn kho</h6>
						<h3 id="tongGT">0 ₫</h3>
					</div>
				</div>
			</div>
			<div class="col-md-3">
				<div class="card bg-danger text-white">
					<div class="card-body">
						<h6>Sản phẩm cảnh báo tồn thấp</h6>
						<h3 id="canhBao">0</h3>
					</div>
				</div>
			</div>
		</div>

		<!-- Bảng sản phẩm -->
		<div class="card shadow">
			<div
				class="card-header d-flex justify-content-between align-items-center">
				<input id="search" type="text" class="form-control w-25"
					placeholder="Tìm sản phẩm...">
				<button class="btn btn-outline-success" onclick="exportExcel()">Xuất
					Excel</button>
			</div>
			<div class="card-body p-0">
				<table class="table table-striped mb-0">
					<thead class="table-dark">
						<tr>
							<th>Hình</th>
							<th>Mã SP</th>
							<th>Tên Sản Phẩm</th>
							<th>Số Lượng Tồn</th>
							<th>Giá Bán</th>
							<th>Giá Trị Tồn</th>
						</tr>
					</thead>
					<tbody id="tableBody">
						<tr>
							<td colspan="6" class="text-center">Đang tải...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script>
$(document).ready(async function() {
    await loadData();
    
    $("#search").on("input", function() {
        const q = $(this).val().toLowerCase();
        loadData(q);
    });
});

async function loadData(search = '') {
    const res = await API.get('/tonkho');
    let data = res.data || [];
    
    if (search) {
        data = data.filter(p => 
            p.tenSP.toLowerCase().includes(search) || 
            p.maSP.toLowerCase().includes(search)
        );
    }
    
    render(data);
}

function render(data) {
    let totalSP = data.length;
    let totalSL = data.reduce((sum, p) => sum + p.soLuongTon, 0);
    let totalGT = data.reduce((sum, p) => sum + p.soLuongTon * (p.giaBan || 0), 0);
    let canhBao = data.filter(p => p.soLuongTon < 10).length;

    $("#tongSP").text(totalSP);
    $("#tongSL").text(totalSL);
    $("#tongGT").text(totalGT.toLocaleString("vi-VN") + " ₫");
    $("#canhBao").text(canhBao);

    let rows = data.map(p => {
        const imgSrc = p.hinhAnh || '/assets/img/no-image.png';
        const giaBan = p.giaBan || 0;
        const giaTriTon = p.soLuongTon * giaBan;
        
        return `
        <tr class="${p.soLuongTon < 10 ? 'table-danger' : ''}">
            <td><img src="${imgSrc}" width="50" style="object-fit: cover;"></td>
            <td>${p.maSP}</td>
            <td>${p.tenSP}</td>
            <td>${p.soLuongTon}</td>
            <td>${giaBan.toLocaleString("vi-VN")} ₫</td>
            <td>${giaTriTon.toLocaleString("vi-VN")} ₫</td>
        </tr>
        `;
    });

    $("#tableBody").html(rows.join(""));
}

function exportExcel() {
    alert("Xuất Excel đang được phát triển...");
}
</script>
</body>
</html>

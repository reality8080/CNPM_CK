<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xuất Kho</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
<script src="/assets/js/api.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/main.js"></script>
</head>
<body>
	<div id="navbar"></div>
	<div class="container-fluid">
		<div class="row">
			<div id="sidebar"></div>
			<main class="col-md-10 ms-sm-auto px-4">
				<ul class="nav nav-tabs mt-3">
					<li class="nav-item"><a class="nav-link active"
						data-tab="list" href="#">Danh Sách</a></li>
					<li class="nav-item"><a class="nav-link" data-tab="create"
						href="#">Tạo Phiếu</a></li>
				</ul>

				<div id="listTab" class="mt-3">
					<table class="table table-striped" id="table">
						<thead>
							<tr>
								<th>Mã Phiếu</th>
								<th>Mã HĐ</th>
								<th>Ngày Xuất</th>
								<th>Nhân Viên</th>
								<th>Trạng Thái</th>
								<th>Thao Tác</th>
							</tr>
						</thead>
						<tbody></tbody>
					</table>
				</div>

				<div id="createTab" class="mt-3" style="display: none">
					<form id="form">
						<div class="card mb-3">
							<div class="card-body">
								<div class="row">
									<div class="col-md-4 mb-3">
										<label class="form-label">Mã Hóa Đơn *</label> <input
											type="text" class="form-control" id="maHD" required>
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Ngày Xuất</label> <input type="date"
											class="form-control" id="ngayXuat" required>
									</div>
									<div class="col-md-4 mb-3">
										<label class="form-label">Ghi Chú</label> <input type="text"
											class="form-control" id="ghiChu">
									</div>
								</div>
							</div>
						</div>

						<div class="card mb-3">
							<div class="card-header d-flex justify-content-between">
								<h5 class="mb-0">Chi Tiết</h5>
								<button type="button" class="btn btn-sm btn-primary" id="addRow">Thêm</button>
							</div>
							<div class="card-body">
								<table class="table" id="detailTable">
									<thead>
										<tr>
											<th>Sản Phẩm</th>
											<th>Tồn Kho</th>
											<th>Số Lượng</th>
											<th></th>
										</tr>
									</thead>
									<tbody></tbody>
								</table>
							</div>
						</div>

						<button type="submit" class="btn btn-primary">Lưu Phiếu</button>
					</form>
				</div>
			</main>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script>
        let sanPhamList = [];
        let chiTietList = [];

        $(document).ready(async function() {
            $('#ngayXuat').val(new Date().toISOString().split('T')[0]);
            loadData();
            loadSanPham();

            $('.nav-link').on('click', function(e) {
                e.preventDefault();
                $('.nav-link').removeClass('active');
                $(this).addClass('active');
                
                const tab = $(this).data('tab');
                $('#listTab, #createTab').hide();
                $(`#${tab}Tab`).show();
            });

            $('#addRow').on('click', addRow);
            $('#form').on('submit', save);
        });

        async function loadData() {
        	const res = await API.get('/xuatkho');
            const data = res.data || [];

            Table.render('table', data, [
                {field: 'maPXK'},
                {field: 'maHD'},
                {render: r => Format.date(r.ngayXuat)},
                {field: 'maNV'},
                {render: r => Format.status(r.trangThai)},
                {render: r => `
                    <button class="btn btn-sm btn-info" onclick="viewDetail('${r.maPXK}')">Chi tiết</button>
                    ${r.trangThai === 'DangXuLy' ? `<button class="btn btn-sm btn-success" onclick="confirmXuat('${r.maPXK}')">Xác nhận</button>` : ''}
                `}
            ]);
        }

        async function loadSanPham() {
        	const res = await API.get('/sanpham');
            sanPhamList = res.data || [];
        }

        function addRow() {
        	if (sanPhamList.length === 0) {
                Toast.warning('Chưa có sản phẩm nào');
                return;
            }
            
            const row = $(`
                <tr>
                    <td>
                        <select class="form-select sp-select" required>
                            <option value="">Chọn sản phẩm</option>
                            ${sanPhamList.map(s => `<option value="${s.maSP}" data-ton="${s.soLuongTon}">${s.tenSP}</option>`).join('')}
                        </select>
                    </td>
                    <td class="ton-cell">-</td>
                    <td><input type="number" class="form-control sl-input" min="1" value="1" required></td>
                    <td><button type="button" class="btn btn-sm btn-danger" onclick="$(this).closest('tr').remove();updateList()">Xóa</button></td>
                </tr>
            `);

            row.find('.sp-select').on('change', function() {
                const ton = $(this).find(':selected').data('ton');
                row.find('.ton-cell').text(ton || 0);
                row.find('.sl-input').attr('max', ton);
                updateList();
            });

            row.find('.sl-input').on('change', updateList);

            $('#detailTable tbody').append(row);
        }

        function updateList() {
            chiTietList = [];
            $('#detailTable tbody tr').each(function() {
                const maSP = $(this).find('.sp-select').val();
                const sl = parseInt($(this).find('.sl-input').val()) || 0;

                if (maSP && sl > 0) {
                    chiTietList.push({sanPham: {maSP}, soLuong: sl});
                }
            });
        }

        async function save(e) {
        	e.preventDefault();
            
            updateList();
            
            if (chiTietList.length === 0) {
                Toast.error('Vui lòng thêm chi tiết xuất kho');
                return;
            }

            const data = {
                maHD: $('#maHD').val(),
                ngayXuat: $('#ngayXuat').val(),
                maNV: 'NV001',
                trangThai: 'DangXuLy',
                chiTiet: chiTietList.map(ct => ({
                    maSP: ct.sanPham.maSP,
                    soLuong: ct.soLuong
                }))
            };

            const res = await API.post('/xuatkho', data);
            Toast.success(res.message);
            
            $('#form')[0].reset();
            $('#detailTable tbody').empty();
            chiTietList = [];
            
            $('.nav-link').removeClass('active');
            $('.nav-link[data-tab="list"]').addClass('active');
            $('#createTab').hide();
            $('#listTab').show();
            
            await loadData();
        }

        async function confirmXuat(id) {
            Modal.confirm('Xác nhận', 'Xác nhận xuất kho?', async () => {
                const res = await API.put(`/xuatkho/${id}/trangthai?trangThai=DaXuat`);
                Toast.success(res.message);
                await loadData();
            });
        }

        async function viewDetail(id) {
        	const res = await API.get(`/xuatkho/${id}`);
            const detail = res.data;
            
            let html = `
                <div class="modal fade" id="detailModal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5>Chi tiết phiếu ${detail.maPXK}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p><strong>Mã HĐ:</strong> ${detail.maHD}</p>
                                <p><strong>Ngày xuất:</strong> ${Format.date(detail.ngayXuat)}</p>
                                <p><strong>Nhân viên:</strong> ${detail.maNV}</p>
                                <p><strong>Trạng thái:</strong> ${Format.status(detail.trangThai)}</p>
                                <table class="table">
                                    <thead><tr><th>Sản phẩm</th><th>Số lượng</th></tr></thead>
                                    <tbody>
                                        ${detail.chiTiet.map(ct => `
                                            <tr>
                                                <td>${ct.tenSP}</td>
                                                <td>${ct.soLuong}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            $('#detailModal').remove();
            $('body').append(html);
            const modal = new bootstrap.Modal($('#detailModal')[0]);
            modal.show();
        }
    </script>
</body>
</html>

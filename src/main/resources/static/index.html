<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>🏬 Hệ thống Quản lý Cửa hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
  <!-- Thanh điều hướng -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">🏬 Quản lý cửa hàng</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" data-page="dashboard" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" data-page="categories" href="#">Danh mục</a></li>
          <li class="nav-item"><a class="nav-link" data-page="products" href="#">Sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" data-page="employees" href="#">Nhân viên</a></li>
          <li class="nav-item"><a class="nav-link" data-page="promotions" href="#">Khuyến mãi</a></li>
          <li class="nav-item"><a class="nav-link" data-page="reports" href="#">Báo cáo</a></li>
        </ul>
        <button id="btnLogout" class="btn btn-outline-light btn-sm">Đăng xuất</button>
      </div>
    </div>
  </nav>

  <!-- Nội dung động -->
  <main class="container py-4">
    <div id="content" class="bg-white p-4 rounded shadow-sm">
      <!-- Trang con sẽ được load vào đây -->
    </div>
  </main>

  <!-- Script điều hướng -->
  <script>
    const API_BASE = "http://localhost:8080/api/manager";

    async function loadPage(pageName) {
      try {
        const res = await fetch(`pages/${pageName}.html`);
        if (!res.ok) throw new Error("Không tải được trang: " + pageName);

        const html = await res.text();
        document.getElementById("content").innerHTML = html;

        // Xóa script cũ nếu có (tránh lỗi khi chuyển trang)
        document.querySelectorAll("script[data-dynamic]").forEach(s => s.remove());

        // Load script tương ứng cho trang
        const script = document.createElement("script");
        script.src = `js/${pageName}.js?v=${Date.now()}`;
        script.defer = true;
        script.dataset.dynamic = "true";
        script.onload = () => {
          // Thông báo sau khi script trang đã nạp xong
          window.dispatchEvent(new CustomEvent('page:loaded', { detail: { page: pageName } }));
        };
        document.body.appendChild(script);
      } catch (err) {
        document.getElementById("content").innerHTML =
          `<div class="alert alert-danger">${err.message}</div>`;
      }
    }

    // Gắn sự kiện cho menu
    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        document.querySelectorAll(".nav-link").forEach(l => l.classList.remove("active"));
        link.classList.add("active");
        loadPage(link.dataset.page);
      });
    });

    // Tải trang mặc định (dashboard)
    window.addEventListener("DOMContentLoaded", () => loadPage("dashboard"));

    // Đăng xuất
    document.getElementById("btnLogout").addEventListener("click", () => {
      localStorage.removeItem("token");
      localStorage.removeItem("role");
      window.location.href = "login.html";
    });

    // Hàm sinh header xác thực
    function authHeaders() {
      const token = localStorage.getItem("token");
      return token ? { Authorization: "Bearer " + token } : {};
    }
  </script>
  
</body>
</html>

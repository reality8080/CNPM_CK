<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .product-image {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>Quản lý khuyến mãi</h2>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item active" aria-current="page">Quản lý khuyến mãi</li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        </ol>
    </nav>
    <div class="card p-3">
        <button class="btn btn-primary mb-3" onclick="window.location.href='add-promotion.html'">Thêm khuyến mãi mới</button>
        <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo Mã giảm giá">
            <button class="btn btn-primary" onclick="searchPromotions()">Tìm kiếm</button>
        </div>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Mã Giảm Giá</th>
                <th>Tên Sản Phẩm</th>
                <th>Phần Trăm Giảm</th>
                <th>Ngày Bắt Đầu</th>
                <th>Ngày Kết Thúc</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody id="promotionTable"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function loadPromotions() {
        fetch('/api/promotions')
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById('promotionTable');
                table.innerHTML = '';
                const promises = data.map(promotion =>
                    fetch(`/api/promotions/${promotion.maKM}/products`)
                        .then(resp => resp.json())
                        .then(products => ({ promotion, products }))
                );
                Promise.all(promises).then(results => {
                    results.forEach(result => {
                        const { promotion, products } = result;
                        const productNames = products.length > 0 ? products.map(p => p.tenSP).join(', ') : 'Tất cả sản phẩm';
                        const productImage = products.length > 0 ? products[0].hinhAnh : '';
                        const row = `
                            <tr>
                                <td>${promotion.maGiamGia}</td>
                                <td>${productNames}</td>
                                <td>${promotion.phanTramGiam}%</td>
                                <td>${new Date(promotion.ngayBatDau).toLocaleDateString('vi-VN')}</td>
                                <td>${new Date(promotion.ngayKetThuc).toLocaleDateString('vi-VN')}</td>
                                <td>
                                    <a href="edit-promotion.html?maKM=${promotion.maKM}" class="btn btn-warning btn-sm me-2">Sửa</a>
                                    <button class="btn btn-danger btn-sm" onclick="deletePromotion('${promotion.maKM}')">Xóa</button>
                                </td>
                            </tr>
                        `;
                        table.innerHTML += row;
                    });
                });
            })
            .catch(error => console.error('Error:', error));
    }

    function searchPromotions() {
        const keyword = document.getElementById('searchInput').value;
        fetch(`/api/promotions/search?keyword=${keyword}`)
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById('promotionTable');
                table.innerHTML = '';
                const promises = data.map(promotion =>
                    fetch(`/api/promotions/${promotion.maKM}/products`)
                        .then(resp => resp.json())
                        .then(products => ({ promotion, products }))
                );
                Promise.all(promises).then(results => {
                    results.forEach(result => {
                        const { promotion, products } = result;
                        const productNames = products.length > 0 ? products.map(p => p.tenSP).join(', ') : 'Tất cả sản phẩm';
                        const productImage = products.length > 0 ? products[0].hinhAnh : '';
                        const row = `
                            <tr>
                                <td>${promotion.maGiamGia}</td>
                                <td>${productNames}</td>
                                <td>${promotion.phanTramGiam}%</td>
                                <td>${new Date(promotion.ngayBatDau).toLocaleDateString('vi-VN')}</td>
                                <td>${new Date(promotion.ngayKetThuc).toLocaleDateString('vi-VN')}</td>
                                <td>
                                    <a href="edit-promotion.html?maKM=${promotion.maKM}" class="btn btn-warning btn-sm me-2">Sửa</a>
                                    <button class="btn btn-danger btn-sm" onclick="deletePromotion('${promotion.maKM}')">Xóa</button>
                                </td>
                            </tr>
                        `;
                        table.innerHTML += row;
                    });
                });
            })
            .catch(error => console.error('Error:', error));
    }

    function deletePromotion(maKM) {
        if (confirm('Bạn có chắc muốn xóa khuyến mãi này?')) {
            fetch(`/api/promotions/${maKM}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        alert('Xóa thành công!');
                        loadPromotions(); // Tải lại danh sách
                    } else {
                        alert('Xóa thất bại!');
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }

    window.onload = loadPromotions;
</script>
</body>
</html>

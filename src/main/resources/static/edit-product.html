<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            display: none;
        }
        .preview-image {
            max-width: 200px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="Quản%20lý%20danh%20mục/manage-categories.html">Quản lý danh mục</a></li>
            <li class="breadcrumb-item"><a href="category-detail.html?maDM=" id="categoryLink">Chi tiết danh mục</a></li>
            <li class="breadcrumb-item active" aria-current="page">Sửa sản phẩm</li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        </ol>
    </nav>
    <div class="card p-3">
        <h2>Sửa sản phẩm</h2>
        <form id="editProductForm">
            <input type="hidden" id="maSP">
            <input type="hidden" id="maDanhMuc">
            <div class="mb-3">
                <label for="tenSP" class="form-label">Tên sản phẩm</label>
                <input type="text" class="form-control" id="tenSP" required>
            </div>
            <div class="mb-3">
                <label for="giaBan" class="form-label">Giá bán</label>
                <input type="number" class="form-control" id="giaBan" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="soLuongTon" class="form-label">Số lượng tồn</label>
                <input type="number" class="form-control" id="soLuongTon" required>
            </div>
            <div class="mb-3">
                <label for="kichThuoc" class="form-label">Kích thước</label>
                <input type="text" class="form-control" id="kichThuoc" required>
            </div>
            <div class="mb-3">
                <label for="mauSac" class="form-label">Màu sắc</label>
                <input type="text" class="form-control" id="mauSac" required>
            </div>
            <div class="mb-3">
                <label for="chatLieu" class="form-label">Chất liệu</label>
                <input type="text" class="form-control" id="chatLieu" required>
            </div>
            <div class="mb-3">
                <label for="moTa" class="form-label">Mô tả</label>
                <textarea class="form-control" id="moTa" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label for="imageFile" class="form-label">Chọn hình ảnh mới <span class="text-muted">(Để trống để giữ hình cũ)</span></label>
                <input type="file" class="form-control" id="imageFile" accept="image/*">
                <img id="previewImage" class="preview-image" alt="Xem trước hình ảnh">
                <p id="currentImage" class="mt-2 text-muted"></p> <!-- Hiển thị URL hiện tại -->
            </div>
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a href="javascript:history.back()" class="btn btn-secondary ms-2">Quay lại</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const maSP = urlParams.get('maSP');
    const maDM = urlParams.get('maDM');

    if (maSP && maDM) {
        document.getElementById('maSP').value = maSP;
        document.getElementById('maDanhMuc').value = maDM;
        document.getElementById('categoryLink').href = `category-detail.html?maDM=${maDM}`;
        document.getElementById('categoryLink').textContent = 'Chi tiết danh mục';

        fetch(`/api/products/${maSP}`)
            .then(response => response.json())
            .then(product => {
                document.getElementById('tenSP').value = product.tenSP;
                document.getElementById('giaBan').value = product.giaBan;
                document.getElementById('soLuongTon').value = product.soLuongTon;
                document.getElementById('kichThuoc').value = product.kichThuoc;
                document.getElementById('mauSac').value = product.mauSac;
                document.getElementById('chatLieu').value = product.chatLieu;
                document.getElementById('moTa').value = product.moTa || '';
                document.getElementById('currentImage').textContent = `Hình ảnh hiện tại: ${product.hinhAnh}`;
            })
            .catch(error => console.error('Error:', error));

        // Xem trước hình ảnh mới
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('previewImage');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                document.getElementById('previewImage').style.display = 'none';
            }
        });

        // Upload hình ảnh lên Cloudinary
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'minhnhut'); // Thay bằng upload preset của bạn
            try {
                const response = await fetch('https://api.cloudinary.com/v1_1/dpofwhvku/image/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.secure_url) {
                    return data.secure_url;
                } else {
                    throw new Error('Upload hình ảnh thất bại');
                }
            } catch (error) {
                throw new Error('Lỗi khi upload hình ảnh: ' + error.message);
            }
        }

        document.getElementById('editProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const product = {
                tenSP: document.getElementById('tenSP').value,
                giaBan: parseFloat(document.getElementById('giaBan').value),
                soLuongTon: parseInt(document.getElementById('soLuongTon').value),
                kichThuoc: document.getElementById('kichThuoc').value,
                mauSac: document.getElementById('mauSac').value,
                chatLieu: document.getElementById('chatLieu').value,
                maDanhMuc: maDM,
                moTa: document.getElementById('moTa').value
            };

            const imageFile = document.getElementById('imageFile').files[0];
            if (imageFile) {
                try {
                    const hinhAnh = await uploadImage(imageFile);
                    product.hinhAnh = hinhAnh;
                } catch (error) {
                    alert('Lỗi khi upload hình ảnh: ' + error.message);
                    return;
                }
            } else {
                // Giữ nguyên hình ảnh cũ nếu không chọn file mới
                const response = await fetch(`/api/products/${maSP}`);
                const oldProduct = await response.json();
                product.hinhAnh = oldProduct.hinhAnh;
            }

            fetch(`/api/products/${maSP}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            })
                .then(response => {
                    if (response.ok) {
                        alert('Cập nhật sản phẩm thành công!');
                        window.location.href = `category-detail.html?maDM=${maDM}`;
                    } else {
                        alert('Cập nhật sản phẩm thất bại!');
                    }
                })
                .catch(error => console.error('Error:', error));
        });
    }
</script>
</body>
</html>

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đăng nhập - Store Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center" style="height:100vh; background:#f7f9fc;">

  <div class="card shadow p-4" style="width: 380px; border-radius:14px;">
    <div class="text-center mb-3">
      <h4 class="text-primary fw-bold">👔 StoreManager</h4>
      <div class="text-muted small">Đăng nhập tài khoản Quản lý</div>
    </div>

    <div id="loginAlert"></div>

    <div class="mb-3">
      <label class="form-label">Tài khoản</label>
      <input id="username" class="form-control" placeholder="Nhập tên đăng nhập">
    </div>
    <div class="mb-3">
      <label class="form-label">Mật khẩu</label>
      <input id="password" type="password" class="form-control" placeholder="••••••••">
    </div>

    <div class="d-grid mt-4">
      <button id="btnLogin" class="btn btn-primary">Đăng nhập</button>
    </div>

    <div class="text-center text-muted small mt-3">
      © 2025 StoreManager
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
document.getElementById("btnLogin").addEventListener("click", async () => {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value.trim();
  const alertBox = document.getElementById("loginAlert");

  if (!user || !pass) {
    alertBox.innerHTML = `<div class="alert alert-warning">Vui lòng nhập đủ thông tin</div>`;
    return;
  }

  try {
    const data = await login(user, pass);
    alertBox.innerHTML = `<div class="alert alert-success">Đăng nhập thành công! Chuyển hướng...</div>`;
    setTimeout(() => window.location.href = "index.html", 1000);
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .card-img-top {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .table td {
            word-wrap: break-word;
            max-width: 150px; /* Giới hạn chiều rộng để tránh tràn */
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="Quản%20lý%20danh%20mục/manage-categories.html">Quản lý danh mục</a></li>
            <li class="breadcrumb-item active" id="categoryName"></li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        </ol>
    </nav>
    <div class="card p-3">
        <h2>Chi tiết danh mục</h2>
        <button class="btn btn-primary mb-3" onclick="window.location.href='add-product.html?maDM=' + getMaDM()">Thêm sản phẩm mới</button>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Hình ảnh</th>
                <th>Tên SP</th>
                <th>Giá Bán</th>
                <th>Số Lượng Tồn</th>
                <th>Kích Thước</th>
                <th>Màu Sắc</th>
                <th>Chất Liệu</th>
                <th>Mô Tả</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const maDM = urlParams.get('maDM');

    function getMaDM() {
        return maDM;
    }

    if (maDM) {
        fetch(`/api/categories/${maDM}`)
            .then(response => response.json())
            .then(category => {
                document.getElementById('categoryName').textContent = category.tenDM;
            })
            .catch(error => console.error('Error loading category:', error));

        fetch(`/api/products/category/${maDM}`)
            .then(response => response.json())
            .then(products => {
                const table = document.getElementById('productTable');
                table.innerHTML = '';
                products.forEach(product => {
                    const row = `
                            <tr>
                                <td><img src="${product.hinhAnh}" class="card-img-top" alt="${product.tenSP}"></td>
                                <td>${product.tenSP}</td>
                                <td>${product.giaBan.toLocaleString('vi-VN')}đ</td>
                                <td>${product.soLuongTon}</td>
                                <td>${product.kichThuoc}</td>
                                <td>${product.mauSac}</td>
                                <td>${product.chatLieu}</td>
                                <td>${product.moTa || 'Không có mô tả'}</td>
                                <td>
                                    <a href="edit-product.html?maSP=${product.maSP}&maDM=${maDM}" class="btn btn-warning btn-sm me-2">Sửa</a>
                                    <button class="btn btn-danger btn-sm" onclick="deleteProduct('${product.maSP}')">Xóa</button>
                                </td>
                            </tr>
                        `;
                    table.innerHTML += row;
                });
            })
            .catch(error => console.error('Error loading products:', error));
    }

    function deleteProduct(maSP) {
        if (confirm('Bạn có chắc muốn xóa sản phẩm này?')) {
            fetch(`/api/products/${maSP}`, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        alert('Xóa thành công!');
                        location.reload(); // Tải lại trang
                    } else {
                        alert('Xóa thất bại!');
                    }
                })
                .catch(error => console.error('Error:', error));
        }
    }
</script>
</body>
</html>

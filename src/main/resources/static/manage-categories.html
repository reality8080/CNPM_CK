<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Quản lý danh mục</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item active" aria-current="page">Quản lý danh mục</li>
                <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            </ol>
        </nav>
        <div class="card p-3">
            <button class="btn btn-primary mb-3" onclick="window.location.href='add-category.html'">Thêm danh mục mới</button>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Mã DM</th>
                        <th>Tên DM</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="categoryTable"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadCategories() {
            fetch('/api/categories')
                .then(response => response.json())
                .then(data => {
                    const table = document.getElementById('categoryTable');
                    table.innerHTML = '';
                    data.forEach(category => {
                        const row = `
                            <tr>
                                <td>${category.maDM}</td>
                                <td><a href="category-detail.html?maDM=${category.maDM}">${category.tenDM}</a></td>
                                <td>
                                    <a href="edit-category.html?maDM=${category.maDM}" class="btn btn-warning btn-sm me-2">Sửa</a>
                                    <button class="btn btn-danger btn-sm" onclick="deleteCategory('${category.maDM}')">Xóa</button>
                                </td>
                            </tr>
                        `;
                        table.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        function deleteCategory(maDM) {
            if (confirm('Bạn có chắc muốn xóa danh mục này?')) {
                fetch(`/api/categories/${maDM}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            alert('Xóa thành công!');
                            loadCategories();
                        } else {
                            alert('Xóa thất bại!');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        }

        window.onload = loadCategories;
    </script>
</body>
</html>

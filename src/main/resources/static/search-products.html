<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .card-img-top {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>Tra cứu sản phẩm</h2>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Tra cứu sản phẩm</li>
        </ol>
    </nav>
    <div class="card p-3">
        <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm theo Mã SP, Tên SP">
            <button class="btn btn-primary" onclick="searchProducts()">Tìm kiếm</button>
        </div>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Hình ảnh</th>
                <th>Tên SP</th>
                <th>Giá Bán</th>
                <th>Số Lượng Tồn</th>
                <th>Danh Mục</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody id="productTable"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function searchProducts() {
        const keyword = document.getElementById('searchInput').value;
        try {
            const response = await fetch(`/api/products/search?keyword=${keyword}`);
            if (!response.ok) throw new Error('Không thể tải danh sách sản phẩm');
            const data = await response.json();
            const table = document.getElementById('productTable');
            table.innerHTML = '';

            // Lấy tên danh mục cho từng sản phẩm
            for (const product of data) {
                const categoryResponse = await fetch(`/api/categories/${product.maDanhMuc}`);
                if (!categoryResponse.ok) throw new Error(`Không thể tải danh mục cho mã ${product.maDanhMuc}`);
                const category = await categoryResponse.json();
                const tenDanhMuc = category.tenDM || 'Chưa có tên';

                const row = `
                        <tr>
                            <td><img src="${product.hinhAnh}" class="card-img-top" alt="${product.tenSP}"></td>
                            <td>${product.tenSP}</td>
                            <td>${product.giaBan.toLocaleString('vi-VN')}đ</td>
                            <td>${product.soLuongTon}</td>
                            <td>${tenDanhMuc}</td>
                            <td><a href="product-detail.html?maSP=${product.maSP}" class="btn btn-info btn-sm">Xem chi tiết</a></td>
                        </tr>
                    `;
                table.innerHTML += row;
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Lỗi khi tra cứu sản phẩm: ' + error.message);
        }
    }

    // Load tất cả sản phẩm khi trang mở
    window.onload = searchProducts;
</script>
</body>
</html>

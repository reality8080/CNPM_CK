<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo bán hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .chart-container {
            position: relative;
            margin-top: 20px;
            height: 400px;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2>Báo cáo bán hàng</h2>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Báo cáo bán hàng</li>
        </ol>
    </nav>
    <div class="card p-3">
        <div class="row mb-3">
            <div class="col-md-3">
                <label for="startDate" class="form-label">Từ ngày</label>
                <input type="date" class="form-control" id="startDate" required>
            </div>
            <div class="col-md-3">
                <label for="endDate" class="form-label">Đến ngày</label>
                <input type="date" class="form-control" id="endDate" required>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary mt-4" onclick="loadReport()">Tìm kiếm</button>
            </div>
        </div>
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Ngày</th>
                <th>Doanh thu</th>
                <th>Số lượng bán</th>
                <th>Số lượng đổi trả</th>
            </tr>
            </thead>
            <tbody id="reportTable"></tbody>
        </table>
        <div class="chart-container">
            <canvas id="salesChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let salesChart = null;

    function loadReport() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;

        if (!startDate || !endDate) {
            alert('Vui lòng chọn khoảng thời gian!');
            return;
        }

        fetch(`/api/hoadon/report?startDate=${startDate}&endDate=${endDate}`)
            .then(response => {
                if (!response.ok) throw new Error('Lỗi khi tải báo cáo');
                return response.json();
            })
            .then(data => {
                const table = document.getElementById('reportTable');
                table.innerHTML = '';
                const labels = data.map(report => new Date(report.date).toLocaleDateString('vi-VN'));
                const revenues = data.map(report => report.revenue);
                const quantitiesSold = data.map(report => report.quantitySold);
                const quantitiesReturned = data.map(report => report.quantityReturned);

                data.forEach(report => {
                    const row = `
                        <tr>
                            <td>${new Date(report.date).toLocaleDateString('vi-VN')}</td>
                            <td>${report.revenue.toLocaleString('vi-VN')}đ</td>
                            <td>${report.quantitySold}</td>
                            <td>${report.quantityReturned}</td>
                        </tr>
                    `;
                    table.innerHTML += row;
                });

                // Tạo hoặc cập nhật biểu đồ với multiple Y-axes
                const ctx = document.getElementById('salesChart').getContext('2d');
                if (salesChart) {
                    salesChart.destroy();
                }
                salesChart = new Chart(ctx, {
                    type: 'bar', // Biểu đồ cột, có thể thay bằng 'line'
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Doanh thu (VNĐ)',
                                data: revenues,
                                backgroundColor: 'rgba(52, 152, 219, 0.7)', // Xanh dương
                                borderColor: 'rgba(52, 152, 219, 1)',
                                borderWidth: 1,
                                yAxisID: 'y1' // Trục y cho doanh thu
                            },
                            {
                                label: 'Số lượng bán',
                                data: quantitiesSold,
                                backgroundColor: 'rgba(46, 204, 113, 0.7)', // Xanh lá
                                borderColor: 'rgba(46, 204, 113, 1)',
                                borderWidth: 1,
                                yAxisID: 'y2' // Trục y cho số lượng
                            },
                            {
                                label: 'Số lượng đổi trả',
                                data: quantitiesReturned,
                                backgroundColor: 'rgba(231, 76, 60, 0.7)', // Đỏ
                                borderColor: 'rgba(231, 76, 60, 1)',
                                borderWidth: 1,
                                yAxisID: 'y2' // Cùng trục y với số lượng bán
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y1: {
                                type: 'linear',
                                position: 'left',
                                title: {
                                    display: true,
                                    text: 'Doanh thu (VNĐ)'
                                },
                                ticks: {
                                    callback: function(value) {
                                        return value.toLocaleString('vi-VN') + 'đ';
                                    }
                                }
                            },
                            y2: {
                                type: 'linear',
                                position: 'right',
                                title: {
                                    display: true,
                                    text: 'Số lượng'
                                },
                                grid: {
                                    drawOnChartArea: false // Ẩn lưới của trục y2 để tránh chồng lấn
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Ngày'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label === 'Doanh thu (VNĐ)') {
                                            return `${label}: ${context.raw.toLocaleString('vi-VN')}đ`;
                                        }
                                        return `${label}: ${context.raw}`;
                                    }
                                }
                            }
                        }
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Lỗi khi tải báo cáo: ' + error.message);
            });
    }

    // Load báo cáo mặc định khi trang mở (lấy ngày hiện tại)
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        const lastMonth = new Date(new Date().setMonth(new Date().getMonth() - 1)).toISOString().split('T')[0];
        document.getElementById('startDate').value = lastMonth;
        document.getElementById('endDate').value = today;
        loadReport();
    };
</script>
</body>
</html>

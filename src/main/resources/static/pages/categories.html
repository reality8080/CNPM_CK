<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="fw-bold text-primary">📁 Quản lý danh mục sản phẩm</h5>
  <button class="btn btn-primary btn-sm" id="btnAddCategory">+ Thêm danh mục</button>
</div>

<div class="card p-3">
  <table class="table table-hover align-middle">
    <thead class="table-light">
      <tr>
        <th>Tên danh mục</th>
        <th>Mô tả</th>
        <th class="text-end" style="width: 120px;">Thao tác</th>
      </tr>
    </thead>
    <tbody id="categoryTableBody"></tbody>
  </table>
</div>

<!-- Modal thêm/sửa danh mục -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="categoryModalLabel">Danh mục sản phẩm</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input id="categoryId" type="hidden">
        <div class="mb-3">
          <label class="form-label">Tên danh mục</label>
          <input id="categoryName" class="form-control" placeholder="Nhập tên danh mục...">
        </div>
        <div class="mb-3">
          <label class="form-label">Mô tả</label>
          <textarea id="categoryDesc" class="form-control" placeholder="Mô tả danh mục..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button class="btn btn-primary" id="btnSaveCategory">Lưu</button>
      </div>
    </div>
  </div>
</div>

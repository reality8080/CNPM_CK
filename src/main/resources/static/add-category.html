<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm danh mục mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="Quản%20lý%20danh%20mục/manage-categories.html">Quản lý danh mục</a></li>
                <li class="breadcrumb-item active" aria-current="page">Thêm danh mục mới</li>
                <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            </ol>
        </nav>
        <div class="card p-3">
            <h2>Thêm danh mục mới</h2>
            <form id="addCategoryForm">
                <div class="mb-3">
                    <label for="tenDM" class="form-label">Tên danh mục</label>
                    <input type="text" class="form-control" id="tenDM" required>
                </div>
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a href="Quản%20lý%20danh%20mục/manage-categories.html" class="btn btn-secondary ms-2">Quay lại</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('addCategoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const tenDM = document.getElementById('tenDM').value;

            fetch('/api/categories', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tenDM })
            })
            .then(response => {
                if (response.ok) {
                    alert('Thêm danh mục thành công!');
                    window.location.href = 'manage-categories.html';
                } else {
                    alert('Thêm danh mục thất bại!');
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-light">
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <h1 class="mb-4">Admin Profile</h1>
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow border-0">
                <div class="card-body text-center">
                    <img id="profilePicture" src="/images/default-user.jpg" alt="Profile Picture" class="img-fluid rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover;">
                    <h5 id="adminFullName" class="card-title">Admin Name</h5>
                    <p class="card-text text-muted" id="adminEmail">admin@example.com</p>
                    <button id="deletePictureBtn" class="btn btn-danger d-none"><i class="bi bi-trash"></i> Remove Picture</button>
                </div>
            </div>
            <div class="card shadow border-0 mt-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-image"></i> Upload Profile Picture</h5>
                </div>
                <div class="card-body">
                    <form id="pictureForm">
                        <div class="mb-3">
                            <input type="file" class="form-control" id="pictureFile" name="file" accept="image/*" required> <!-- Added name="file" -->
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-upload"></i> Upload</button>
                    </form>
                    <div id="pictureMessage" class="mt-3"></div>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-person-lines-fill"></i> Profile Information</h5>
                </div>
                <div class="card-body">
                    <form id="updateProfileForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>
                            <div class="invalid-feedback">Full name is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="phoneNumber">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold">Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control" id="address">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label fw-semibold">Date of Birth</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar"></i></span>
                                <input type="date" class="form-control" id="dateOfBirth">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-save"></i> Update Profile</button>
                    </form>
                    <div id="profileMessage" class="mt-3"></div>
                </div>
            </div>
            <div class="card shadow border-0 mt-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-key"></i> Change Password</h5>
                </div>
                <div class="card-body">
                    <form id="updatePasswordForm">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-semibold">Current Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="currentPassword" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="currentPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">Current password is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="newPassword" minlength="6" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="currentPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">New password must be at least 6 characters.</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="currentPassword">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100"><i class="bi bi-arrow-clockwise"></i> Update Password</button>
                    </form>
                    <div id="passwordMessage" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/custom.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

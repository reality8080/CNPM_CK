<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
</head>
<body class="bg-light">
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <h1 class="mb-4">Manage Employees</h1>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#employeeModal" id="addNewEmployeeBtn">
        <i class="bi bi-person-plus"></i> Add New Employee
    </button>
    <div id="employeeAlert" class="alert d-none" role="alert"></div>
    <div class="card shadow border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table id="adminTable" class="table table-hover">
                    <thead>
                    <tr>
                        <th>Email</th>
                        <th>Full Name</th>
                        <th>Department</th>
                        <th>Role</th>
                        <th>Active</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                    <!-- Employees loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="employeeModal" tabindex="-1" aria-labelledby="employeeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="employeeModalLabel">Add New Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="employeeForm">
                <div class="modal-body">
                    <input type="hidden" id="employeeEmail">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="newEmail" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="newEmail" required>
                            </div>
                            <div class="invalid-feedback">Valid email is required.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="newFullName" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="newFullName" required>
                            </div>
                            <div class="invalid-feedback">Full name is required.</div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="newPassword" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword">
                                    <i class="bi bi-eye"></i> </button>
                            </div>
                            <div class="invalid-feedback">Password is required.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="newDepartment" class="form-label fw-semibold">Department</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control" id="newDepartment" placeholder="e.g., IT">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="newActive" checked>
                            <label class="form-check-label" for="newActive">
                                <i class="bi bi-check-circle"></i> Active Status
                            </label>
                        </div>
                    </div>
                    <div id="modalAlert" class="alert alert-dismissible fade show d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-circle"></i> Close</button>
                    <button type="submit" class="btn btn-primary" id="saveEmployeeBtn"><i class="bi bi-check-lg"></i> Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/js/custom.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="/js/admin/admin-employees.js"></script> <!-- Giả sử JS riêng cho employees -->
</body>
</html>

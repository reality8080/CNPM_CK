<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <h1 class="mb-4">Admin Dashboard</h1>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow border-0 dashboard-card text-center h-100">
                <div class="card-body">
                    <i class="bi bi-people display-6 text-primary mb-2"></i>
                    <h5 class="card-title">Total Employees</h5>
                    <h1 id="total-employees" class="display-4 text-primary">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow border-0 dashboard-card text-center h-100">
                <div class="card-body">
                    <i class="bi bi-person-check display-6 text-success mb-2"></i>
                    <h5 class="card-title">Active Employees</h5>
                    <h1 id="active-employees" class="display-4 text-success">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow border-0 dashboard-card text-center h-100">
                <div class="card-body">
                    <i class="bi bi-building display-6 text-info mb-2"></i>
                    <h5 class="card-title">Departments</h5>
                    <h1 id="departments" class="display-4 text-info">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow border-0 dashboard-card text-center h-100">
                <div class="card-body">
                    <i class="bi bi-bell display-6 text-warning mb-2"></i>
                    <h5 class="card-title">Alerts</h5>
                    <h1 id="alerts" class="display-4 text-warning">0</h1>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-pie-chart"></i> Department Distribution</h5>
                </div>
                <div class="card-body">
                    <canvas id="departmentChart" height="200"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-clock-history"></i> Recent Activities</h5>
                </div>
                <div class="card-body">
                    <ul id="recent-activities" class="list-group list-group-flush">
                        <!-- Activities loaded via JS -->
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="bi bi-person-plus text-success"></i> New employee added</span>
                            <small class="text-muted">2 hours ago</small>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/custom.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="/js/admin/admin-employees.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

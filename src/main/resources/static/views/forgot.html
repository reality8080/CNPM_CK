<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center rounded-top"><h4 class="mb-0">Reset Your Password</h4></div>
                <div class="card-body p-4">
                    <form id="forgotRequestForm" novalidate>
                        <div class="mb-3">
                            <label for="forgotEmail" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="forgotEmail" placeholder="example@domain.com" required>
                            </div>
                            <div class="invalid-feedback">Please enter a valid email.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <span class="spinner-border spinner-border-sm d-none"></span> Send OTP
                        </button>
                    </form>
                    <form id="forgotConfirmForm" class="mt-3" style="display:none;">
                        <div class="mb-3">
                            <label for="forgotOtp" class="form-label fw-semibold">Enter OTP</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="text" class="form-control" id="forgotOtp" placeholder="123456" required>
                            </div>
                            <div class="invalid-feedback">OTP is required.</div>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
                                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="newPassword">
                                    <i class="bi bi-eye"></i>
                                </button>                            </div>
                            <div class="invalid-feedback">New password is required.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <span class="spinner-border spinner-border-sm d-none"></span> Reset Password
                        </button>
                    </form>
                    <div id="forgotMessage" class="mt-3"></div>
                    <div class="mt-3 text-center"><a href="/views/login.html" class="text-decoration-none">Back to Login</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/js/auth.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Giảm Giá Ứng Dụng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/product-common.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container-fluid">


    <h2 class="mb-4">Quản Lý Giảm Giá Ứng Dụng</h2>

    <form id="discountSearchForm" class="search-form row g-3 align-items-center mb-3">
        <div class="col-md-4">
            <input type="text" class="form-control" id="searchShopId" placeholder="Tìm kiếm theo ID Cửa Hàng">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm Kiếm</button>
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#discountModal" id="addNewDiscountBtn">
                Thêm Giảm Giá Mới
            </button>
        </div>
    </form>

    <div id="discountAlert" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="text-primary">Danh Sách Giảm Giá</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col">ID Giảm Giá</th>
                        <th scope="col">ID Cửa Hàng</th>
                        <th scope="col">% Giảm</th>
                        <th scope="col">Ngày Bắt Đầu</th>
                        <th scope="col">Ngày Kết Thúc</th>
                        <th scope="col">Trạng Thái</th>
                        <th scope="col">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody id="discountTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="discountModal" tabindex="-1" aria-labelledby="discountModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="discountModalLabel">Thêm Giảm Giá Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="discountForm">
                <div class="modal-body">
                    <input type="hidden" id="discountId">
                    <div class="mb-3">
                        <label for="shopId" class="form-label">ID Cửa Hàng <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="shopId" required>
                    </div>
                    <div class="mb-3">
                        <label for="discountPercentage" class="form-label">% Giảm <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="discountPercentage" min="0" max="100" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="startDate" class="form-label">Ngày Bắt Đầu <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="startDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="endDate" class="form-label">Ngày Kết Thúc <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control" id="endDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Trạng Thái <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" required>
                            <option value="">Chọn trạng thái</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div id="modalAlert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary" id="saveDiscountBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/custom.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="/js/product/app-discounts.js"></script>
</body>
</html>

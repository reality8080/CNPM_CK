<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Nhà Cung Cấp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/product-common.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container-fluid">
    <h2 class="mb-4">Quản Lý Nhà Cung Cấp</h2>

    <form id="supplierSearchForm" class="search-form row g-3 align-items-center mb-3">
        <div class="col-md-4">
            <input type="text" class="form-control" id="searchName" placeholder="Tìm kiếm theo Tên Nhà Cung Cấp">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm Kiếm</button>
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#supplierModal" id="addNewSupplierBtn">
                Thêm Nhà Cung Cấp Mới
            </button>
        </div>
    </form>

    <div id="supplierAlert" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="text-primary">Danh Sách Nhà Cung Cấp</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col">ID Nhà Cung Cấp</th>
                        <th scope="col">Tên Nhà Cung Cấp</th>
                        <th scope="col">Địa Chỉ</th>
                        <th scope="col">SĐT</th>
                        <th scope="col">Email</th>
                        <th scope="col">Mô Tả</th>
                        <th scope="col">Trạng Thái</th>
                        <th scope="col">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody id="supplierTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="supplierModal" tabindex="-1" aria-labelledby="supplierModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="supplierModalLabel">Thêm Nhà Cung Cấp Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="supplierForm">
                <div class="modal-body">
                    <input type="hidden" id="supplierId">
                    <div class="mb-3">
                        <label for="supplierName" class="form-label">Tên Nhà Cung Cấp <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="supplierName" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">Địa Chỉ</label>
                        <input type="text" class="form-control" id="address">
                    </div>
                    <div class="mb-3">
                        <label for="phoneNumber" class="form-label">Số Điện Thoại</label>
                        <input type="tel" class="form-control" id="phoneNumber">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="supplierDescription" class="form-label">Mô Tả</label>
                        <textarea class="form-control" id="supplierDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">Trạng Thái <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" required>
                            <option value="">Chọn trạng thái</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <div id="modalAlert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary" id="saveSupplierBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/custom.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="/js/product/suppliers.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/product-common.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<div class="container-fluid">


    <h2 class="mb-4">Quản Lý Danh Mục Sản Phẩm</h2>

    <form id="categorySearchForm" class="search-form row g-3 align-items-center mb-3">
        <div class="col-md-4">
            <input type="text" class="form-control" id="searchName" placeholder="Tìm kiếm theo Tên Danh Mục (không phân biệt hoa thường)">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Tìm Kiếm</button>
        </div>
        <div class="col-auto">
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#categoryModal" id="addNewCategoryBtn">
                Thêm Danh Mục Mới
            </button>
        </div>
    </form>

    <div id="categoryAlert" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="text-primary">Danh Sách Danh Mục</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle" id="categoryTable">
                    <thead>
                    <tr>
                        <th scope="col">ID Danh Mục</th>
                        <th scope="col">Tên Danh Mục</th>
                        <th scope="col">Mô Tả</th>
                        <th scope="col">Thao Tác</th>
                    </tr>
                    </thead>
                    <tbody id="categoryTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="categoryModalLabel">Thêm Danh Mục Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="categoryForm">
                <div class="modal-body">
                    <input type="hidden" id="categoryId">
                    <div class="mb-3">
                        <label for="categoryName" class="form-label">Tên Danh Mục <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="categoryName" placeholder="Nhập tên danh mục (bắt buộc)" required>
                    </div>
                    <div class="mb-3">
                        <label for="categoryDescription" class="form-label">Mô Tả</label>
                        <textarea class="form-control" id="categoryDescription" rows="3" placeholder="Nhập mô tả danh mục (tùy chọn)"></textarea>
                    </div>
                    <div id="modalAlert" class="alert d-none" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/custom.js"></script>
<script src="/js/admin/admin.js"></script>
<script src="/js/product/categories.js"></script>
</body>
</html>

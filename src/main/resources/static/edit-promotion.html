<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa khuyến mãi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .product-list, .selected-list { max-height: 300px; overflow-y: auto; margin-bottom: 15px; }
        .product-item { padding: 5px 0; }
    </style>
</head>
<body>
<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="manage-promotions.html">Quản lý khuyến mãi</a></li>
            <li class="breadcrumb-item active" aria-current="page">Sửa khuyến mãi</li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
        </ol>
    </nav>
    <div class="card p-3">
        <h2>Sửa khuyến mãi</h2>
        <form id="editPromotionForm">
            <input type="hidden" id="maKM">
            <div class="mb-3">
                <label for="maGiamGia" class="form-label">Mã giảm giá</label>
                <input type="text" class="form-control" id="maGiamGia" required>
            </div>
            <div class="mb-3">
                <label for="phanTramGiam" class="form-label">Phần trăm giảm (%)</label>
                <input type="number" class="form-control" id="phanTramGiam" min="0" step="5" required>
            </div>
            <div class="mb-3">
                <label for="ngayBatDau" class="form-label">Ngày bắt đầu</label>
                <input type="date" class="form-control" id="ngayBatDau" required>
            </div>
            <div class="mb-3">
                <label for="ngayKetThuc" class="form-label">Ngày kết thúc</label>
                <input type="date" class="form-control" id="ngayKetThuc" required>
            </div>
            <div class="mb-3">
                <label for="searchProduct" class="form-label">Tìm kiếm sản phẩm</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="searchProduct" placeholder="Nhập tên sản phẩm">
                    <button class="btn btn-primary" type="button" onclick="searchProducts()">Tìm kiếm</button>
                </div>
            </div>
            <div class="mb-3 product-list" id="productList">
                <!-- Danh sách sản phẩm sẽ được điền bằng JavaScript -->
            </div>
            <div class="mb-3">
                <label class="form-label">Sản phẩm đã chọn</label>
                <div class="selected-list" id="selectedProductList">
                    <!-- Danh sách sản phẩm đã chọn sẽ được điền bằng JavaScript -->
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a href="manage-promotions.html" class="btn btn-secondary ms-2">Quay lại</a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let products = [];
    let filteredProducts = [];
    let selectedProducts = new Set();

    // Load danh sách sản phẩm ban đầu
    function loadProducts() {
        fetch('/api/products')
            .then(response => {
                if (!response.ok) throw new Error('Không thể tải danh sách sản phẩm. Mã lỗi: ' + response.status);
                return response.json();
            })
            .then(data => {
                console.log('Dữ liệu sản phẩm:', data);
                products = data;
                filteredProducts = products;
                if (products.length === 0) {
                    alert('Không có sản phẩm nào trong hệ thống!');
                }
                updateProductList();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Lỗi: ' + error.message);
            });
    }

    // Tìm kiếm sản phẩm
    function searchProducts() {
        const keyword = document.getElementById('searchProduct').value.trim().toLowerCase();
        filteredProducts = products.filter(p => p.tenSP.toLowerCase().includes(keyword));
        updateProductList();
    }

    // Cập nhật danh sách sản phẩm với checkbox
    function updateProductList() {
        const list = document.getElementById('productList');
        list.innerHTML = '';
        if (filteredProducts.length === 0) {
            list.innerHTML = '<p>Không tìm thấy sản phẩm nào.</p>';
            return;
        }
        filteredProducts.forEach(product => {
            const div = document.createElement('div');
            div.className = 'product-item form-check';
            div.innerHTML = `
                <input class="form-check-input" type="checkbox" value="${product.maSP}" id="product_${product.maSP}"
                       ${selectedProducts.has(product.maSP) ? 'checked' : ''}>
                <label class="form-check-label" for="product_${product.maSP}">
                    ${product.tenSP} (Mã: ${product.maSP})
                </label>
            `;
            div.querySelector('input').addEventListener('change', function(e) {
                if (e.target.checked) {
                    selectedProducts.add(product.maSP);
                } else {
                    selectedProducts.delete(product.maSP);
                }
                updateSelectedProductList();
            });
            list.appendChild(div);
        });
    }

    // Cập nhật danh sách sản phẩm đã chọn
    function updateSelectedProductList() {
        const list = document.getElementById('selectedProductList');
        list.innerHTML = '';
        if (selectedProducts.size === 0) {
            list.innerHTML = '<p>Chưa chọn sản phẩm nào.</p>';
            return;
        }
        selectedProducts.forEach(maSP => {
            const product = products.find(p => p.maSP === maSP);
            if (product) {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    ${product.tenSP} (Mã: ${product.maSP})
                    <button class="btn btn-sm btn-danger ms-2" onclick="removeSelectedProduct('${product.maSP}')">Xóa</button>
                `;
                list.appendChild(div);
            }
        });
    }

    // Xóa sản phẩm đã chọn
    function removeSelectedProduct(maSP) {
        selectedProducts.delete(maSP);
        const checkbox = document.querySelector(`#product_${maSP}`);
        if (checkbox) checkbox.checked = false;
        updateSelectedProductList();
    }

    // Load dữ liệu khuyến mãi hiện tại
    const urlParams = new URLSearchParams(window.location.search);
    const maKM = urlParams.get('maKM');

    if (maKM) {
        fetch(`/api/promotions/${maKM}`)
            .then(response => {
                if (!response.ok) throw new Error('Không thể tải khuyến mãi. Mã lỗi: ' + response.status);
                return response.json();
            })
            .then(promotion => {
                document.getElementById('maKM').value = promotion.maKM;
                document.getElementById('maGiamGia').value = promotion.maGiamGia;
                document.getElementById('phanTramGiam').value = promotion.phanTramGiam;
                document.getElementById('ngayBatDau').value = new Date(promotion.ngayBatDau).toISOString().split('T')[0];
                document.getElementById('ngayKetThuc').value = new Date(promotion.ngayKetThuc).toISOString().split('T')[0];
                if (promotion.maSP) {
                    promotion.maSP.forEach(ma => selectedProducts.add(ma));
                    updateSelectedProductList();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Lỗi: ' + error.message);
            });
    }

    // Xử lý submit form
    document.getElementById('editPromotionForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const maGiamGia = document.getElementById('maGiamGia').value.trim();
        const phanTramGiam = parseFloat(document.getElementById('phanTramGiam').value);
        const ngayBatDau = new Date(document.getElementById('ngayBatDau').value);
        const ngayKetThuc = new Date(document.getElementById('ngayKetThuc').value);
        const maSP = Array.from(selectedProducts);

        const promotion = { maGiamGia, phanTramGiam, ngayBatDau, ngayKetThuc, maSP };
        fetch(`/api/promotions/${maKM}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(promotion)
        })
            .then(response => {
                if (response.ok) {
                    alert('Cập nhật khuyến mãi thành công!');
                    window.location.href = 'manage-promotions.html';
                } else {
                    alert('Cập nhật khuyến mãi thất bại!');
                }
            })
            .catch(error => console.error('Error:', error));
    });

    // Load dữ liệu khi trang mở
    window.onload = loadProducts;
</script>
</body>
</html>

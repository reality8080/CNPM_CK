v spring.application.name=CNPM_NhanVienBanHang


spring.data.mongodb.uri=mongodb://localhost:27017/DB_NhanVienBanHang
spring.data.mongodb.auto-index-creation=true


server.port=8085

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/
spring.messages.basename=i18n/messages



logging.level.org.springframework=INFO
logging.level.vn.iotstar=DEBUG
logging.file.name=logs/application.log

springdoc.swagger-ui.security.enabled=false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB